name: build-apk

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "aegis-apk/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: aegis-apk
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp aegis-apk/app/build/outputs/apk/debug/app-debug.apk out/aegis-sentinel-debug.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-sentinel-apk
          path: out/aegis-sentinel-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Aegis Sentinel APK (build ${{ github.run_number }})
          body: |
            Installable debug APK of Aegis Sentinel (offline WebCrypto demo of the
            Physics Shield, Keyless Bridge, Witness Protocol, and Physical Truth Ledger).
            Enable "Install unknown apps" on Android, then install aegis-sentinel-debug.apk.
          files: out/aegis-sentinel-debug.apk
